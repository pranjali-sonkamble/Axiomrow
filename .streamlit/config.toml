[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
maxUploadSize = 150
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false

[client]
# Hide Python exception details / paths from end users (they stay in the logs).
showErrorDetails = "none"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
